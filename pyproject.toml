[project]
name = "ecom-churn-predict"
version = "0.1.0"
description = "电商用户流失预测Web系统 - ANN-MLP + FastAPI + Vue3"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "torch==2.5.1",
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "scikit-learn==1.5.2",
    "pandas==2.2.3",
    "numpy==1.26.4",
    "matplotlib==3.10.0",
    "pydantic==2.10.4",
    "python-multipart==0.0.20",
    "aiofiles==24.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
torch = { index = "https://download.pytorch.org/whl/cpu" }